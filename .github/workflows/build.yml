name: Build Rey Optimizer Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Validate Python sources
        run: python -m compileall -q .

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name "Rey Optimizer"
          --icon "assets/rey-optimizer.ico"
          --add-data "assets;assets"
          --distpath dist
          main.py

      - name: Create release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/'Rey Optimizer.exe' release/'Rey Optimizer.exe'
          Copy-Item README.md release/README.md
          Copy-Item LICENSE release/LICENSE
          Compress-Archive -Path release/* -DestinationPath 'Rey-Optimizer-Windows.zip' -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Rey-Optimizer-Windows
          path: |
            dist/Rey Optimizer.exe
            Rey-Optimizer-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rey Optimizer.exe
            Rey-Optimizer-Windows.zip
          generate_release_notes: true
